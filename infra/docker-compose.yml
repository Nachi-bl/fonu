services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local
      POSTGRES_DB: inventory
    ports: ['5432:5432']
    volumes: ['inventory_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory']
      interval: 3s
      retries: 10
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local
      POSTGRES_DB: inventory_test
    ports: ['5433:5432']
    tmpfs: ['/var/lib/postgresql/data']
volumes:
  inventory_data:
